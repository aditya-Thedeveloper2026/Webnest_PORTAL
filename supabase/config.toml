project_id = "webnest-nexus"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:8000"
additional_redirect_urls = ["http://127.0.0.1:8000", "https://YOUR_CLOUDFLARE_PAGES_DOMAIN"]
enable_signup = false

[auth.email]
double_confirm_changes = true
enable_confirmations = false

[functions.username-login]
verify_jwt = false

[functions.bootstrap-admin]
verify_jwt = false

[functions.create-employee]
verify_jwt = true

[functions.admin-employee-action]
verify_jwt = true
